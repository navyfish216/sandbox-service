<!DOCTYPE html>
<html>
	<head>
		<title>top page</title>
		<meta http-equiv="Content-Type" content="text/html" charset="UTF-8" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
			rel="stylesheet" 
			integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
			crossorigin="anonymous">
	</head>
	<body class="container">
		<h1 class="display-4 mb-4">Hello page</h1>
		<p th:text="${msg}" style="white-space: pre-wrap;"></p>
		<div class="h6 alert alert-primary">
			<form method="post" action="/web/multi-form">
				<div class="my-2">
					<input class="form-check-input" type="checkbox" name="check1" />
					<label class="frm-check-label" for="check1">同意します</label>
				</div>
				<div class="my-2">
					<input class="form-check-input" type="radio" name="radio1" value="male" />
					<label class="frm-check-label" for="radioA">男性</label>
				</div>
				<div class="my-2">
					<input class="form-check-input" type="radio" name="radio1" value="female" />
					<label class="frm-check-label" for="radioB">女性</label>
				</div>
				<div class="my-2">
					<input class="form-check-input" type="radio" name="radio1" value="other" />
					<label class="frm-check-label" for="radioC">その他</label>
				</div>
				<div class="my-2">
					<select class="form-select" name="select1" size="1">
						<option value="no select"></option>
						<option value="no pc">持っていない</option>
						<option value="Windows">Windows</option>
						<option value="Mac">Mac</option>
						<option value="Linux">Linux</option>
					</select>
				</div>
				<div class="my-2">
					<select class="form-select" name="select2" size="4" multiple="multiple">
						<option value="no mobile">持っていない</option>
						<option value="android">Android</option>
						<option value="iphone">iPhone</option>
						<option value="Winfone">Windows Phone</option>
					</select>
				</div>
				<input class="btn btn-primary" type="submit" value="Click" />
			</form>
		</div>
	</body>
</html>
